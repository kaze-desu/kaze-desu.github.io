# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------
name: Boyun Wang
email: bywang42@gmail.com
description: >-
  Boyun Wang, MSc student in Artificial Intelligence at the University of Macau.
  Working on multimodal large language models, spatial intelligence, and agentic visual verification.
footer_text: >-
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with the
  <a href="https://github.com/alexanderhay2020/al-folio-" target="_blank">al-folio*</a> theme.

url: "" # set to https://kaze-desu.github.io only if you deploy from source via Actions
baseurl: "" # the subpath of your site, e.g. /blog
last_updated:

# -----------------------------------------------------------------------------
# Open Graph
# -----------------------------------------------------------------------------
serve_og_meta: true
og_image: /assets/img/projects/localagent.png

# -----------------------------------------------------------------------------
# Social integration
# -----------------------------------------------------------------------------
github_username: kaze-desu
twitter_username: # your Twitter handle
linkedin_username: "%E4%BC%AF%E5%8C%80-%E7%8E%8B-a22735347"
scholar_userid: InwmqCAAAAAJ
orcid_id: 0009-0007-7530-0568
medium_username:
quora_username:
publons_id:
research_gate_profile:
blogger_url:

contact_note: >
  Email is the most reliable way to reach me.

google_analytics:

# -----------------------------------------------------------------------------
# Optional features
# -----------------------------------------------------------------------------
show_social_icons: true
enable_anchorjs: true
enable_katex: false

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
collections:
  news:
    defaults:
      layout: post
    output: true
    permalink: /news/:path/
  projects:
    output: true
    permalink: /projects/:path/

news_limit: 5

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
timezone: Asia/Macau

include: ['_pages']
exclude: [vendor, README.md, LICENSE, Gemfile, Gemfile.lock, serve.cmd, bin, 'CV (4).pdf']

plugins:
  - jekyll-email-protect
  - jekyll-scholar
  - jemoji

# Jekyll-Scholar
scholar:
  last_name: Wang
  first_name: Boyun

  style: apa
  locale: en

  sort_by: year
  order: descending

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib

  replace_strings: true
  join_strings: true

  query: "@*"

# -----------------------------------------------------------------------------
# Other settings
# -----------------------------------------------------------------------------
katex_version: "0.9.0"
