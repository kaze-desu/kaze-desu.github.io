<a class="skip-link" href="#main">Skip to content</a>

<header class="top-bar" id="top-bar">
  <div class="container top-bar__inner">
    <a class="brand" href="{{ '/' | prepend: site.baseurl }}" aria-label="{{ site.name }}, home">
      <img src="{{ '/assets/img/prof_pic.jpg' | prepend: site.baseurl }}" alt="" width="36" height="36">
      <span>{{ site.name }}</span>
    </a>

    <nav class="nav" id="site-nav" aria-label="Primary">
      <ul class="nav__list">
        <li><a class="nav__link" href="{{ '/' | prepend: site.baseurl }}"{% if page.url == "/" %} aria-current="page"{% endif %}>About</a></li>
        {% assign nav_pages = site.pages | where_exp: "p", "p.nav_order" | sort: "nav_order" %}
        {% for p in nav_pages %}
          {% if p.url != "/" %}
            {% assign section = p.url | remove: "/" %}
            <li>
              <a class="nav__link" href="{{ p.url | prepend: site.baseurl }}"
                {% if page.url == p.url or page.collection == section %} aria-current="page"{% endif %}>{{ p.nav_title | default: p.title }}</a>
            </li>
          {% endif %}
        {% endfor %}
      </ul>
    </nav>

    <div class="top-bar__actions">
      <button class="icon-btn theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
        <span class="icon-dark">{% include icon.html name="dark_mode" %}</span>
        <span class="icon-light">{% include icon.html name="light_mode" %}</span>
      </button>
      <button class="icon-btn nav-toggle" id="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="Open menu">
        <span class="icon-menu">{% include icon.html name="menu" %}</span>
        <span class="icon-close">{% include icon.html name="close" %}</span>
      </button>
    </div>
  </div>
</header>
