<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fff8f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16130d" media="(prefers-color-scheme: dark)">

  <title>{{ site.name }}{% if page.title and page.url != "/" %} | {{ page.nav_title | default: page.title }}{% endif %}</title>
  <meta name="description" content="{{ page.summary | default: site.description | strip_html | strip_newlines | escape }}">

  {% if site.serve_og_meta %}
    <meta property="og:site_name" content="{{ site.name }}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{ site.name }}{% if page.title and page.url != '/' %} | {{ page.nav_title | default: page.title }}{% endif %}" />
    <meta property="og:url" content="{{ page.url | prepend: site.baseurl | prepend: site.url }}" />
    <meta property="og:description" content="{{ site.description | strip_html | strip_newlines | escape }}" />
    <meta property="og:image" content="{%- if page.og_image -%}{{ page.og_image }}{%- else -%}{{ site.og_image }}{%- endif -%}" />
  {% endif %}

  <!-- Apply the saved colour theme before first paint; without a saved choice the system setting is used. -->
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
      } catch (e) {}
      var dark = root.getAttribute('data-theme')
        ? root.getAttribute('data-theme') === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      root.setAttribute('data-theme-effective', dark ? 'dark' : 'light');
    })();
  </script>

  <link rel="icon" href="{{ '/assets/img/favicon.ico' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="preload" href="{{ '/assets/fonts/roboto-flex-latin.woff2' | prepend: site.baseurl | prepend: site.url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="stylesheet" href="{{ '/assets/css/fontawesome-all.min.css' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="stylesheet" href="{{ '/assets/css/academicons.min.css' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
</head>
